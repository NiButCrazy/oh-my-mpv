打开(&O)
	打开文件(&F)		script-binding open_file/open
	打开文件夹(&D)		script-binding open_file/open_dir
	添加字幕(&S)		script-binding open_file/add_subtitle
	添加音轨(&A)		script-binding open_file/add_audio

播放(&Y)	cycle pause		hidden=not pause and not idle_active	disabled=idle_active
暂停(&U)	cycle pause		hidden=idle_active or pause
停止(&S)	stop			hidden=idle ~= true						disabled=idle_active

静音(&M)	cycle mute; show-text "静音：${mute}"		checked=mute		disabled=idle_active

下一个文件(&N)	playlist-next	disabled=playlist_count < 2
上一个文件(&P)	playlist-prev	disabled=playlist_count < 2

界面			disabled=idle_active
	布局(&L)
		默认(&D)		no-osd change-list script-opts append modernz-layout=default
		紧凑(&C)		no-osd change-list script-opts append modernz-layout=compact
		迷你(&M)		no-osd change-list script-opts append modernz-layout=mini
		进度条(&S)		no-osd change-list script-opts append modernz-layout=seekbar
	主题(&T)
		图标主题(&I)
			Fluent(&F)		no-osd change-list script-opts append modernz-icon_theme=fluent
			Material(&M)	no-osd change-list script-opts append modernz-icon_theme=material
		图标样式(&S)
			混合(&X)		no-osd change-list script-opts append modernz-icon_style=mixed
			实心(&F)		no-osd change-list script-opts append modernz-icon_style=filled
			轮廓(&O)		no-osd change-list script-opts append modernz-icon_style=outline

	进度条(&S)
		常驻进度(&P)		script-binding modernz/progress-toggle
		进度条高度(&H)
			小(&S)			no-osd change-list script-opts append modernz-seekbar_height=small
			中(&M)			no-osd change-list script-opts append modernz-seekbar_height=medium
			大(&L)			no-osd change-list script-opts append modernz-seekbar_height=large
			特大(&X)		no-osd change-list script-opts append modernz-seekbar_height=xlarge
		章节标记(&C)
			间隙(&G)		no-osd change-list script-opts append modernz-nibbles_style=gap
			三角(&T)		no-osd change-list script-opts append modernz-nibbles_style=triangle
			条状(&B)		no-osd change-list script-opts append modernz-nibbles_style=bar
			单条(&S)		no-osd change-list script-opts append modernz-nibbles_style=single-bar

	切换 OSC 可见性(&C)	script-binding modernz/visibility

	语言(&A)
		默认(&U)			no-osd change-list script-opts append modernz-language=default
		阿拉伯语(&A)		no-osd change-list script-opts append modernz-language=ar
		丹麦语(&D)			no-osd change-list script-opts append modernz-language=dk
		英语(&E)			no-osd change-list script-opts append modernz-language=en
		法语(&F)			no-osd change-list script-opts append modernz-language=fr
		德语(&G)			no-osd change-list script-opts append modernz-language=de
		冰岛语(&I)			no-osd change-list script-opts append modernz-language=is
		日语(&J)			no-osd change-list script-opts append modernz-language=jp
		波兰语(&P)			no-osd change-list script-opts append modernz-language=pl
		俄语(&R)			no-osd change-list script-opts append modernz-language=ru
		西班牙语(&S)		no-osd change-list script-opts append modernz-language=es
		简体中文(&C)		no-osd change-list script-opts append modernz-language=zh

播放列表(&P)	$playlist

轨道(&T)	$tracks
播放控制(&L)
	重新加载(&R)		set file-local-options/start ${=time-pos}; playlist-play-index current yes

	显示时长(&D)	hidden=not p["current-tracks/video/image"] or p["current-tracks/audio"]
		1 秒			set image-display-duration 1		checked=image_display_duration == 1
		2 秒			set image-display-duration 2		checked=image_display_duration == 2
		5 秒			set image-display-duration 5		checked=image_display_duration == 5
		10 秒			set image-display-duration 10		checked=image_display_duration == 10
		无限			set image-display-duration inf		checked=image_display_duration == math.huge
	速度(&E)
		25%		set speed 0.25		checked=speed == 0.25
		50%		set speed 0.50		checked=speed == 0.50
		75%		set speed 0.75		checked=speed == 0.75
		100%	set speed 1			checked=speed == 1
		125%	set speed 1.25		checked=speed == 1.25
		150%	set speed 1.50		checked=speed == 1.50
		175%	set speed 1.75		checked=speed == 1.75
		200%	set speed 2			checked=speed == 2
		400%	set speed 4			checked=speed == 4
		800%	set speed 8			checked=speed == 8

	设置/清除 A-B 循环点(&A)	ab-loop
	循环文件(&L)		cycle-values loop-file inf no		checked=loop_file == "inf"
	循环播放列表(&O)	cycle-values loop-playlist inf no	checked=loop_playlist == "inf"

	随机播放(&S)	playlist-shuffle
	取消随机(&U)	playlist-unshuffle
章节(&C)			$chapters
版本/标题(&E)	$editions

截图(&S)
	截图(&S)						screenshot			disabled=not p["current-tracks/video"]
	截图（不含字幕）(&W)	screenshot video	disabled=not p["current-tracks/video"]
	截图窗口(&I)	screenshot window

视频(&V)
	轨道(&T)	$video-tracks

	填充(&F)		no-osd cycle-values panscan 0 1; no-osd set video-unscaled no; no-osd set video-zoom 0		checked=panscan == 1
	拉伸(&S)	no-osd cycle keepaspect																		checked=not keepaspect
	不缩放(&U)	no-osd cycle-values video-unscaled yes no; no-osd set video-zoom 0; no-osd set panscan 0	checked=video_unscaled
	缩放(&Z)
		&50%	set video-zoom -1	checked=video_zoom == -1
		&100%	set video-zoom  0	checked=video_zoom == 0
		&200%	set video-zoom  1	checked=video_zoom == 1
	宽高比(&A)
		&16:9		set video-aspect-override 16:9		checked=math.abs(video_aspect_override - 1.7) < 0.1
		&4:3		set video-aspect-override 4:3		checked=math.abs(video_aspect_override - 1.3) < 0.1
		&2.35:1		set video-aspect-override 2.35:1	checked=video_aspect_override == 2.35
		默认(&D)	set video-aspect-override no		checked=video_aspect_override == -2
	居中(&C)		no-osd set video-pan-x 0; no-osd set video-pan-y 0; no-osd set video-align-x 0; no-osd set video-align-y 0		disabled=video_pan_x == 0 and video_pan_y == 0 and video_align_x == 0 and video_align_y == 0

	顺时针旋转(&C)			cycle-values video-rotate 90 180 270 0
	逆时针旋转(&O)	cycle-values video-rotate 270 180 90 0

	去色带(&D)			cycle deband		checked=deband
	反交错(&E)		cycle deinterlace	checked=deinterlace_active
音频(&A)
	轨道(&T)		$audio-tracks
	设备(&D)		$audio-devices
	声道(&C)
		自动(&A)	set audio-channels auto-safe	checked=audio_channels == "auto-safe"
		立体声(&S)	set audio-channels stereo		checked=audio_channels == "stereo"
		单声道(&M)	set audio-channels mono			checked=audio_channels == "mono"

	增加延迟(&E)		add audio-delay  0.1
	减少延迟(&L)		add audio-delay -0.1
字幕(&S)
	轨道(&T)		$sub-tracks
	可见(&V)	cycle sub-visibility	checked=sub_visibility

	增加延迟(&D)		add sub-delay  0.1
	减少延迟(&E)		add sub-delay -0.1

	放大(&U)		add sub-scale  0.1
	缩小(&O)		add sub-scale -0.1

	行(&L)	script-binding select/select-subtitle-line	disabled=not sid or p["current-tracks/sub/codec"] == "dvb_subtitle" or p["current-tracks/sub/codec"] == "dvd_subtitle" or p["current-tracks/sub/codec"] == "hdmv_pgs_subtitle"
	次字幕(&S)
		轨道(&T)		$secondary-sub-tracks
		可见(&V)	cycle secondary-sub-visibility	checked=secondary_sub_visibility

		增加延迟(&D)		add secondary-sub-delay  0.1
		减少延迟(&E)		add secondary-sub-delay -0.1

窗口(&W)
	全屏(&F)		cycle fullscreen	checked=fullscreen
	边框(&B)		cycle border		checked=border
	标题栏(&T)		cycle title-bar		checked=title_bar
	置顶(&A)		cycle ontop			checked=ontop
	窗口缩放(&S)
		50%		set window-scale 0.5	checked=math.abs(get("current-window-scale", 0) - 0.5) < 0.1
		100%	set window-scale 1		checked=math.abs(get("current-window-scale", 0) - 1) < 0.1
		200%	set window-scale 2		checked=math.abs(get("current-window-scale", 0) - 2) < 0.1
		300%	set window-scale 3		checked=math.abs(get("current-window-scale", 0) - 3) < 0.1
视图(&I)
	播放统计(&P)	script-binding stats/display-page-1-toggle
	文件信息(&F)	script-binding stats/display-page-5-toggle
	时间 OSD(&T)	no-osd cycle-values osd-level 3 1	checked=osd_level == 3
配置(&R)	$profiles
工具(&O)
	复制路径(&P)	set clipboard/text ${path}			disabled=idle_active
	复制字幕(&S)	set clipboard/text ${sub-text}		disabled=not sid or p["current-tracks/sub/codec"] == "dvd_subtitle" or p["current-tracks/sub/codec"] == "hdmv_pgs_subtitle"
	复制标题(&T)	set clipboard/text ${media-title}	disabled=idle_active

	硬件解码(&H)	cycle-values hwdec no auto	checked=hwdec_current and hwdec_current ~= "no"	disabled=p["current-tracks/video/image"] ~= false
	属性(&R)		script-binding select/show-properties
	控制台(&C)	script-binding commands/open

退出(&Q)				quit
