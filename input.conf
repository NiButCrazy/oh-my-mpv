MBTN_LEFT	script-message-to oh_my_mpv region-exec rel 0 0 1 0.85 "script-binding oh_my_mpv/play_pause"
SPACE	script-binding oh_my_mpv/play_pause
MBTN_LEFT_DBL	ignore
MBTN_FORWARD	quit
MBTN_MID	cycle fullscreen
# MBTN_RIGHT	script-message-to contextmenu_native show

# ---- OSD 汉化：覆盖 mpv 内置英文提示 ----
# 音量
WHEEL_UP  script-message-to oh_my_mpv region-exec rel 0 0 0.2 0.85 "add volume 1;show-text 音量：$${volume}%"
WHEEL_DOWN  script-message-to oh_my_mpv region-exec rel 0 0 0.2 0.85 "add volume -1;show-text 音量：$${volume}%"

UP	add volume 1; show-text "音量：${volume}%"
DOWN	add volume -1; show-text "音量：${volume}%"
# 缩放
Ctrl+WHEEL_UP add video-zoom 0.1; show-text "缩放：${video-zoom}"
Ctrl+WHEEL_DOWN add video-zoom -0.1; show-text "缩放：${video-zoom}"


# oh my mpv 调试模式
F3 script-message-to oh_my_mpv region-exec-debug toggle